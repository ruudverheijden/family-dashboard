name: Browseracceptatie
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python -m pytest tests/e2e --browser ${{ matrix.browser }} --tracing retain-on-failure --screenshot only-on-failure --junitxml=test-results/results.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
