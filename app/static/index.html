<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5f0"><title>Samen — ons gezinsdashboard</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='28' fill='%23d66b4f'/%3E%3Ctext x='50' y='70' text-anchor='middle' font-size='70' fill='white'%3Es%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/static/style.css"><script type="module" src="/static/app.js"></script></head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="Samen startpagina"><span class="brandmark" aria-hidden="true"><span>s</span><span>✳</span></span><span><span id="brand-title">samen</span><span id="brand-caption" class="brand-caption">een plek voor ons allemaal</span></span></a><nav class="main-tabs" aria-label="Hoofdnavigatie"><button data-tab="calendar" class="active" aria-current="page"><span data-icon="calendar"></span><span>Kalender</span></button><button data-tab="home"><span data-icon="home"></span><span>Home Assistant</span></button><button data-tab="photos"><span data-icon="image"></span><span>Immich</span></button><button data-tab="groceries"><span data-icon="basket"></span><span>Boodschappen</span></button></nav><button id="clock-toggle" type="button" aria-label="Toon grote klok" aria-haspopup="dialog" aria-controls="clock-dialog"><svg id="analog-clock" class="analog-clock" viewBox="0 0 72 72" role="img" aria-label="Analoge klok"><circle class="clock-face" cx="36" cy="36" r="33"></circle><g id="clock-numerals" class="clock-numerals"><text x="36" y="12">12</text><text x="48" y="15">1</text><text x="57" y="24">2</text><text x="60" y="37">3</text><text x="57" y="50">4</text><text x="48" y="59">5</text><text x="36" y="62">6</text><text x="24" y="59">7</text><text x="15" y="50">8</text><text x="12" y="37">9</text><text x="15" y="24">10</text><text x="24" y="15">11</text></g><line id="clock-hour-hand" class="clock-hand hour-hand" x1="36" y1="38" x2="36" y2="22"></line><line id="clock-minute-hand" class="clock-hand minute-hand" x1="36" y1="38" x2="36" y2="12"></line><line id="clock-second-hand" class="clock-hand second-hand" x1="36" y1="39" x2="36" y2="9"></line><circle class="clock-center" cx="36" cy="36" r="2"></circle></svg></button><div id="calendar-date" class="datebadge" aria-label="Datum en eerstvolgende afspraak"><div><strong><span id="calendar-date-full"></span><span id="calendar-date-compact"></span></strong><span id="next-agenda-item" class="muted" aria-live="polite">Geen volgende afspraak gepland</span></div></div><button id="admin" class="icon-button" aria-label="Beheerinstellingen"><span data-icon="settings"></span></button></header>
<div id="connection" class="connection hidden" role="status"><span data-connection-message></span><button id="connection-retry" class="secondary small">Opnieuw proberen</button></div>
<main id="app"><div class="loading">Ons dashboard wordt geladen…</div></main>
<footer><div id="agenda-status"></div></footer>
<dialog id="clock-dialog" aria-labelledby="clock-dialog-title"><button type="button" id="clock-close" class="clock-close" aria-label="Sluiten"><span data-icon="close"></span></button><div class="clock-popup-content"><h2 id="clock-dialog-title">Hoe laat is het?</h2><div id="clock-popup-face"></div><p id="clock-popup-time" aria-live="off"></p></div></dialog><dialog id="dialog"><div id="dialog-content"></div></dialog><dialog id="discard-confirmation" aria-labelledby="discard-confirmation-title" aria-describedby="discard-confirmation-message"><h2 id="discard-confirmation-title">Niet-opgeslagen wijzigingen</h2><p id="discard-confirmation-message"></p><div class="form-actions"><button type="button" id="keep-editing" class="secondary" autofocus>Verder bewerken</button><button type="button" id="leave-without-saving" class="danger">Wijzigingen verlaten</button></div></dialog><dialog id="album-dialog" aria-labelledby="album-picker-title"><div id="album-dialog-content"></div></dialog><div id="toast" role="status" class="toast hidden"></div>
</body></html>
