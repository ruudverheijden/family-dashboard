name: Controle
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python tools/format_css.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: node --check app/static/app.js
      - run: node --experimental-vm-modules tools/check_frontend.mjs
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest==9.2.0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: family-dashboard:test
      - run: |
          docker build -t family-dashboard:test .
          CONTAINER_TEST_IMAGE=family-dashboard:test python -m pytest tests/test_container_security.py tests/test_container_storage.py -q
          docker compose up -d
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8080/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
        env:
          ADMIN_PASSWORD: ci-test-password-not-for-production
          DASHBOARD_IMAGE: family-dashboard:test
      - if: always()
        run: docker compose down -v
        env:
          ADMIN_PASSWORD: ci-test-password-not-for-production
          DASHBOARD_IMAGE: family-dashboard:test
